<div class="screen-view scr-dashboard active" data-screen="dashboard" id="screen-dashboard">
<div class="device">
  <div class="hero-fx"><canvas id="fx"></canvas></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <main>
    <div class="title">
      <div class="line1">MAIL</div>
      <div class="line2">
        FACTORY
        <span class="g1">FACTORY</span>
        <span class="g2">FACTORY</span>
      </div>
    </div>

    <div class="logo-wrap">
      <div class="energy-field-outer"></div>
      <div class="energy-field"></div>
      <div class="reticle"></div>
      <div class="orbit"><span></span></div>
      <div class="ring">
        <div class="depth-grid"></div>
        <div class="holo-noise"></div>
        <div class="scan-line"></div>
        <img src="assets/logo/logo.png" style="width: 100%; height: 100%; position: relative; z-index: 10; display: block; margin: 0 auto; transform: translateX(-4px); object-fit: contain; pointer-events: none;" alt="MAIL FACTORY Logo">
      </div>
    </div>

    <div class="status-block">
      <div class="label">SYSTEM STATUS</div>
      <div class="value">ONLINE <span class="dot"></span></div>
    </div>

    <div class="btn primary" data-nav="engine">
      <div class="ic">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff2222" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"/><path d="M13 6l6 6-6 6"/>
        </svg>
      </div>
      <div class="label"><b>OPEN</b> FACTORY</div>
      <div class="chev">›</div>
    </div>

    <div class="btn secondary" data-nav="library">
      <div class="ic">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4.5c-2.2-1.4-5-1.4-7.5-.3v14c2.5-1.1 5.3-1.1 7.5.3"/>
          <path d="M12 4.5c2.2-1.4 5-1.4 7.5-.3v14c-2.5-1.1-5.3-1.1-7.5.3"/>
          <path d="M12 4.5v14"/>
        </svg>
      </div>
      <div class="label">OPEN LIBRARY</div>
      <div class="chev">›</div>
    </div>

    <div class="grid">
      <div class="feature">
        <div class="ic">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff2222" stroke-width="1.8">
            <path d="M12 2l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5l8-3z"/>
            <path d="M8.5 12l2.3 2.3L16 9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h4>100% NATIVE</h4>
        <p>Android App</p>
      </div>

      <div class="feature">
        <div class="ic">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff2222" stroke-width="1.8">
            <path d="M12 2l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5l8-3z"/>
            <path d="M13 8l-4 5h3l-1 4 4-5h-3l1-4z" fill="#ff2222" stroke="none"/>
          </svg>
        </div>
        <h4>ROOT POWERED</h4>
        <p>Max Performance</p>
      </div>

      <div class="feature">
        <div class="ic">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff2222" stroke-width="1.7">
            <path d="M7.5 16A3.5 3.5 0 016 9.3a4.5 4.5 0 018.6-1.8A3.8 3.8 0 0117 15.2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="17.5" cy="17.5" r="2.2"/>
            <path d="M17.5 15.8v-.8M17.5 19.9v.8M19.6 17.5h.8M14.6 17.5h.8" stroke-linecap="round"/>
          </svg>
        </div>
        <h4>NETWORK READY</h4>
        <p>HTTP/HTTPS • SOCKS5</p>
      </div>

      <div class="feature">
        <div class="ic">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff2222" stroke-width="1.8">
            <path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" stroke-linejoin="round"/>
          </svg>
        </div>
        <h4>SMART ENGINE</h4>
        <p>High Success Rate</p>
      </div>
    </div>
  </main>
</div>
</div>
