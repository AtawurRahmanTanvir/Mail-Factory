<div class="backup-screen" id="backupScreen">
  <div class="screen">
    <div class="glow-top"></div>
    <div class="content">

      <div class="header">
        <div class="back-btn" data-action="close-backup"><svg class="ic"><use href="#i-chevron-left" xlink:href="#i-chevron-left"/></svg></div>
        <h1>Backup</h1>
      </div>

      <div class="glow-line">
        <div class="base"></div>
        <div class="hot"></div>
        <svg viewBox="0 0 427 14" preserveAspectRatio="none">
          <polyline class="brackets" points="20,5 10,7 20,9"/>
          <polyline class="brackets" points="407,5 417,7 407,9"/>
          <path class="traces" d="M20,5.5 L64,5.5 L76,7"/>
          <path class="traces" d="M20,8.5 L52,8.5 L64,7"/>
          <path class="traces" d="M407,5.5 L363,5.5 L351,7"/>
          <path class="traces" d="M407,8.5 L375,8.5 L363,7"/>
        </svg>
      </div>

      <p class="backup-note">Connect a destination to automatically back up your data. No provider is connected yet — connections activate when a real provider adapter is configured.</p>

      <div class="section">
        <div class="card">
          <div class="row" style="cursor:default;">
            <div class="icon-box"><svg class="ic"><use href="#i-drive" xlink:href="#i-drive"/></svg></div>
            <span class="label">Google Drive</span>
            <button type="button" class="connect-btn" data-action="backup-connect" data-provider="gdrive" data-label="Google Drive">Connect</button>
          </div>
          <div class="divider"></div>
          <div class="row" style="cursor:default;">
            <div class="icon-box"><svg class="ic"><use href="#i-gdocs" xlink:href="#i-gdocs"/></svg></div>
            <span class="label">Google Docs</span>
            <button type="button" class="connect-btn" data-action="backup-connect" data-provider="gdocs" data-label="Google Docs">Connect</button>
          </div>
          <div class="divider"></div>
          <div class="row" style="cursor:default;">
            <div class="icon-box"><svg class="ic"><use href="#i-github" xlink:href="#i-github"/></svg></div>
            <span class="label">GitHub</span>
            <button type="button" class="connect-btn" data-action="backup-connect" data-provider="github" data-label="GitHub">Connect</button>
          </div>
          <div class="divider"></div>
          <div class="row" style="cursor:default;">
            <div class="icon-box"><svg class="ic"><use href="#i-dropbox" xlink:href="#i-dropbox"/></svg></div>
            <span class="label">Dropbox</span>
            <button type="button" class="connect-btn" data-action="backup-connect" data-provider="dropbox" data-label="Dropbox">Connect</button>
          </div>
          <div class="divider"></div>
          <div class="row" style="cursor:default;">
            <div class="icon-box"><svg class="ic"><use href="#i-onedrive" xlink:href="#i-onedrive"/></svg></div>
            <span class="label">OneDrive</span>
            <button type="button" class="connect-btn" data-action="backup-connect" data-provider="onedrive" data-label="OneDrive">Connect</button>
          </div>
          <div class="divider"></div>
          <div class="row" style="cursor:default;">
            <div class="icon-box"><svg class="ic"><use href="#i-phone" xlink:href="#i-phone"/></svg></div>
            <span class="label">Phone Storage</span>
            <button type="button" class="connect-btn" data-action="backup-connect" data-provider="phone" data-label="Phone Storage">Connect</button>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
