<div class="backup-screen" id="page-contactus">
  <div class="screen">
    <div class="glow-top"></div>
    <div class="content">
      <div class="header">
        <div class="back-btn" data-action="close-subpage" data-page="contactus"><svg class="ic"><use href="#i-chevron-left" xlink:href="#i-chevron-left"/></svg></div>
        <h1>Contact Us</h1>
      </div>
      <div class="glow-line">
        <div class="base"></div><div class="hot"></div>
        <svg viewBox="0 0 427 14" preserveAspectRatio="none">
          <polyline class="brackets" points="20,5 10,7 20,9"/><polyline class="brackets" points="407,5 417,7 407,9"/>
          <path class="traces" d="M20,5.5 L64,5.5 L76,7"/><path class="traces" d="M20,8.5 L52,8.5 L64,7"/>
          <path class="traces" d="M407,5.5 L363,5.5 L351,7"/><path class="traces" d="M407,8.5 L375,8.5 L363,7"/>
        </svg>
      </div>

      <div class="sp-intro">
        <div class="sp-intro-title">Get in Touch</div>
        <p class="sp-intro-text">Choose your preferred way to contact us.</p>
      </div>

      <div class="sp-contact-card">
        <div class="sp-contact-head"><div class="icon-box"><svg class="ic"><use href="#i-facebook" xlink:href="#i-facebook"/></svg></div><span class="t">Facebook</span></div>
        <button class="sp-btn" type="button" data-action="open-link" data-link="facebook" data-label="Facebook">Send Message →</button>
      </div>
      <div class="sp-contact-card">
        <div class="sp-contact-head"><div class="icon-box"><svg class="ic"><use href="#i-whatsapp" xlink:href="#i-whatsapp"/></svg></div><span class="t">WhatsApp</span></div>
        <button class="sp-btn" type="button" data-action="open-link" data-link="whatsapp" data-label="WhatsApp">Send Message →</button>
      </div>
      <div class="sp-contact-card">
        <div class="sp-contact-head"><div class="icon-box"><svg class="ic"><use href="#i-telegram" xlink:href="#i-telegram"/></svg></div><span class="t">Telegram</span></div>
        <button class="sp-btn" type="button" data-action="open-link" data-link="telegram" data-label="Telegram">Send Message →</button>
      </div>
      <div class="sp-contact-card">
        <div class="sp-contact-head"><div class="icon-box"><svg class="ic"><use href="#i-mail" xlink:href="#i-mail"/></svg></div><span class="t">Email</span></div>
        <button class="sp-btn" type="button" data-action="contact-email">Send Email →</button>
      </div>
      <div class="sp-contact-card">
        <div class="sp-contact-head"><div class="icon-box"><svg class="ic"><use href="#i-youtube" xlink:href="#i-youtube"/></svg></div><span class="t">YouTube</span></div>
        <button class="sp-btn" type="button" data-action="open-link" data-link="youtube" data-label="YouTube channel">Visit Channel →</button>
      </div>

    </div>
  </div>
</div>
