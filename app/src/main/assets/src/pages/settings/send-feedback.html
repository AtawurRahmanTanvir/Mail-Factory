<div class="backup-screen" id="page-sendfeedback">
  <div class="screen">
    <div class="glow-top"></div>
    <div class="content">
      <div class="header">
        <div class="back-btn" data-action="close-subpage" data-page="sendfeedback"><svg class="ic"><use href="#i-chevron-left" xlink:href="#i-chevron-left"/></svg></div>
        <h1>Send Feedback</h1>
      </div>
      <div class="glow-line">
        <div class="base"></div><div class="hot"></div>
        <svg viewBox="0 0 427 14" preserveAspectRatio="none">
          <polyline class="brackets" points="20,5 10,7 20,9"/><polyline class="brackets" points="407,5 417,7 407,9"/>
          <path class="traces" d="M20,5.5 L64,5.5 L76,7"/><path class="traces" d="M20,8.5 L52,8.5 L64,7"/>
          <path class="traces" d="M407,5.5 L363,5.5 L351,7"/><path class="traces" d="M407,8.5 L375,8.5 L363,7"/>
        </svg>
      </div>

      <div class="sp-intro">
        <div class="sp-intro-title">Share Your Ideas</div>
        <p class="sp-intro-text">Have a suggestion, feature request, or idea to improve the app? Share it with the community.</p>
      </div>

      <div class="section">
        <div class="section-header"><svg class="ic"><use href="#i-send" xlink:href="#i-send"/></svg><span class="label">Feedback Types</span><span class="line"></span></div>
        <ul class="sp-bullet-list">
          <li>Feature Suggestions</li>
          <li>UI / UX Feedback</li>
          <li>Improvement Ideas</li>
          <li>General Feedback</li>
        </ul>
      </div>

      <button class="sp-btn" type="button" data-action="open-link" data-link="feedback" data-label="Feedback channel" style="margin-top:6px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-send" xlink:href="#i-send"/></svg>
        Post Feedback →
      </button>

    </div>
  </div>
</div>
