<div class="backup-screen" id="page-version">
  <div class="screen">
    <div class="glow-top"></div>
    <div class="content">
      <div class="header">
        <div class="back-btn" data-action="close-subpage" data-page="version"><svg class="ic"><use href="#i-chevron-left" xlink:href="#i-chevron-left"/></svg></div>
        <h1>Version</h1>
      </div>
      <div class="glow-line">
        <div class="base"></div><div class="hot"></div>
        <svg viewBox="0 0 427 14" preserveAspectRatio="none">
          <polyline class="brackets" points="20,5 10,7 20,9"/><polyline class="brackets" points="407,5 417,7 407,9"/>
          <path class="traces" d="M20,5.5 L64,5.5 L76,7"/><path class="traces" d="M20,8.5 L52,8.5 L64,7"/>
          <path class="traces" d="M407,5.5 L363,5.5 L351,7"/><path class="traces" d="M407,8.5 L375,8.5 L363,7"/>
        </svg>
      </div>

      <div class="version-hero">
        <div class="vn">v1.0.0</div>
        <div class="vs"><span class="dot"></span>Stable</div>
      </div>

      <button class="sp-btn" style="border:none; margin-bottom:11px;" data-action="check-update">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-refresh" xlink:href="#i-refresh"/></svg>
        Check for Updates
      </button>
      <button class="sp-btn ghost" data-action="view-versions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><use href="#i-history" xlink:href="#i-history"/></svg>
        <span id="viewVersionsLabel">View Versions</span>
      </button>

      <div id="versionHistoryList" style="margin-top:16px;"></div>

    </div>
  </div>
</div>
